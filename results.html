<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลลัพธ์สุขภาพจิต</title>
    <style>
        body {
            background-image: url('https://i.imgur.com/HyUP6Cl.jpg');
            background-size: cover;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            padding: 20px;
            margin-top: 8%;
        }

        h1 {
            font-size: 3em;
            font-weight: bold;
            text-shadow: 3px 3px 15px rgba(255, 255, 255, 0.9);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 3px 3px 15px rgba(255, 255, 255, 0.9); }
            to { text-shadow: 3px 3px 25px rgba(255, 215, 0, 1); }
        }

        p {
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            animation: fadeIn 2s ease-in-out;
        }

        .result-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 25px;
            border-radius: 15px;
            display: inline-block;
            width: 60%;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.5);
            animation: scaleUp 1s ease-in-out;
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .button {
            background: linear-gradient(45deg, #FF6347, #FF4500);
            border: none;
            padding: 12px 25px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            margin: 15px;
            color: white;
            text-transform: uppercase;
            box-shadow: 0px 5px 15px rgba(255, 69, 0, 0.5);
            transition: all 0.3s ease;
        }

        .button:hover {
            background: linear-gradient(45deg, #FF4500, #FF6347);
            transform: scale(1.1);
            box-shadow: 0px 10px 20px rgba(255, 69, 0, 0.8);
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>ผลลัพธ์สุขภาพจิตของคุณ</h1>
        
        <div class="result-box">
            <p id="result-text">กำลังวิเคราะห์ผลลัพธ์...</p>
        </div>

        <br>
        <a href="survey.html" class="button">ทำแบบสอบถามอีกครั้ง</a>
        <a href="consultation.html" class="button">ขอคำปรึกษา</a>
        <a href="index.html" class="button">กลับไปหน้าหลัก</a>
    </div>

    <script>
        function getQueryParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        const riskLevel = getQueryParameter("risk");
        let resultText = "";

        if (riskLevel === "high") {
            resultText = "ผลการประเมินของคุณแสดงให้เห็นว่าคุณอาจมีภาวะเครียดหรือภาวะซึมเศร้า กรุณาติดต่อผู้ให้คำปรึกษาเพื่อขอความช่วยเหลือ";
        } else {
            resultText = "ผลการประเมินของคุณแสดงให้เห็นว่าสุขภาพจิตของคุณอยู่ในเกณฑ์ปกติ หากคุณต้องการคำปรึกษาเพิ่มเติม สามารถติดต่อผู้เชี่ยวชาญได้";
        }

        document.getElementById("result-text").innerText = resultText;
    </script>

</body>
</html>
