<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบสอบถามสุขภาพจิต</title>
    <style>
        body {
            background-image: url('https://i.imgur.com/HyUP6Cl.jpg');
            background-size: cover;
            background-position: center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            padding: 20px;
            margin-top: 8%;
        }

        h1 {
            font-size: 3em;
            font-weight: bold;
            text-shadow: 3px 3px 15px rgba(255, 255, 255, 0.9);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 3px 3px 15px rgba(255, 255, 255, 0.9); }
            to { text-shadow: 3px 3px 25px rgba(255, 215, 0, 1); }
        }

        p {
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            animation: fadeIn 2s ease-in-out;
        }

        .question-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 25px;
            border-radius: 15px;
            display: inline-block;
            width: 60%;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.5);
            animation: slideUp 1s ease-in-out;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .button {
            background: linear-gradient(45deg, #FF6347, #FF4500);
            border: none;
            padding: 12px 25px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            margin: 15px;
            color: white;
            text-transform: uppercase;
            box-shadow: 0px 5px 15px rgba(255, 69, 0, 0.5);
            transition: all 0.3s ease;
        }

        .button:hover {
            background: linear-gradient(45deg, #FF4500, #FF6347);
            transform: scale(1.1);
            box-shadow: 0px 10px 20px rgba(255, 69, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>แบบสอบถามสุขภาพจิต</h1>
        <p>กรุณาตอบคำถามต่อไปนี้เพื่อประเมินสุขภาพจิตของคุณ</p>

        <div class="question-box">
            <p id="question">ช่วงนี้คุณรู้สึกเหนื่อยล้าหรือหมดไฟบ่อยไหม?</p>
            <button class="button" onclick="nextQuestion('yes')">ใช่</button>
            <button class="button" onclick="nextQuestion('no')">ไม่</button>
        </div>
    </div>

    <script>
        const questions = [
            "ช่วงนี้คุณรู้สึกเหนื่อยล้าหรือหมดไฟบ่อยไหม?",
            "คุณมักรู้สึกโดดเดี่ยวหรือไม่มีใครเข้าใจคุณหรือไม่?",
            "คุณมีความกังวลหรือความเครียดมากเกินไปหรือไม่?",
            "คุณยังรู้สึกสนุกกับสิ่งที่เคยชอบทำอยู่ไหม?",
            "คุณรู้สึกว่าสามารถควบคุมอารมณ์ของตัวเองได้ดีหรือไม่?",
            "คุณเคยรู้สึกอยากอยู่คนเดียวมากกว่าการพบปะผู้คนหรือไม่?",
            "คุณรู้สึกว่ามีคนคอยสนับสนุนและรับฟังคุณหรือไม่?",
            "คุณเคยมีความคิดเกี่ยวกับการทำร้ายตัวเองหรือไม่?"
        ];

        let currentQuestion = 0;
        let score = 0;

        function nextQuestion(answer) {
            if (answer === "yes") {
                score++;
            }

            currentQuestion++;

            if (currentQuestion >= questions.length) {
                let riskLevel = score >= 4 ? "high" : "low";
                window.location.href = `results.html?risk=${riskLevel}`;
                return;
            }

            document.getElementById("question").innerText = questions[currentQuestion];
        }
    </script>

</body>
</html>
