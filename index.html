<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บสุขภาพจิตออนไลน์</title>
    <style>
        body {
            background-image: url('https://i.imgur.com/HyUP6Cl.jpg');
            background-size: cover;
            background-position: center;
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            padding: 20px;
            margin-top: 15%;
        }

        h1 {
            font-size: 3.5em;
            text-shadow: 3px 3px 10px rgba(255, 255, 255, 0.8);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 3px 3px 10px rgba(255, 255, 255, 0.8); }
            to { text-shadow: 3px 3px 20px rgba(255, 215, 0, 1); }
        }

        p {
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            animation: fadeIn 2s ease-in-out;
        }

        .button {
            background: linear-gradient(45deg, #FF6347, #FF4500);
            border: none;
            padding: 12px 25px;
            font-size: 1.4em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            margin-top: 20px;
            color: white;
            text-transform: uppercase;
            box-shadow: 0px 5px 15px rgba(255, 69, 0, 0.5);
            transition: all 0.3s ease;
        }

        .button:hover {
            background: linear-gradient(45deg, #FF4500, #FF6347);
            transform: scale(1.1);
            box-shadow: 0px 10px 20px rgba(255, 69, 0, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ยินดีต้อนรับสู่เว็บสุขภาพจิตออนไลน์</h1>
        <p>ดูแลสุขภาพจิตของคุณด้วยการให้คำปรึกษาและแบบสอบถาม</p>
        <a href="survey.html"><button class="button">เริ่มแบบสอบถาม</button></a>
    </div>
</body>
</html>
