<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำให้ปรึกษา</title>
    <style>
        body {
            background-image: url('https://i.imgur.com/HyUP6Cl.jpg');
            background-size: cover;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            padding: 20px;
            margin-top: 10%;
        }

        h1 {
            font-size: 3em;
            font-weight: bold;
            text-shadow: 3px 3px 15px rgba(255, 255, 255, 0.8);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 3px 3px 15px rgba(255, 255, 255, 0.8); }
            to { text-shadow: 3px 3px 25px rgba(255, 215, 0, 1); }
        }

        p {
            font-size: 1.5em;
            margin: 10px 0;
            animation: scaleUp 1s ease-in-out;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .contact-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            text-align: left;
            width: 60%;
            margin: 20px auto;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.5);
        }

        .button {
            background: linear-gradient(45deg, #FF6347, #FF4500);
            border: none;
            padding: 12px 25px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            margin: 15px;
            color: white;
            text-transform: uppercase;
            box-shadow: 0px 5px 15px rgba(255, 69, 0, 0.5);
            transition: all 0.3s ease;
        }

        .button:hover {
            background: linear-gradient(45deg, #FF4500, #FF6347);
            transform: scale(1.1);
            box-shadow: 0px 10px 20px rgba(255, 69, 0, 0.8);
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>คำให้ปรึกษา</h1>
        <p>หากคุณต้องการคำปรึกษาเพิ่มเติม กรุณาติดต่อผู้ให้คำปรึกษาตามรายชื่อด้านล่าง</p>

        <div class="contact-box">
            <p><strong>ดร.สมชาย วัฒนสุข</strong></p>
            <p>เบอร์โทร: 081-234-5678</p>
            <hr>
            <p><strong>คุณณัฐธิดา รุ่งเรือง</strong></p>
            <p>เบอร์โทร: 089-876-5432</p>
            <hr>
            <p><strong>ศูนย์สุขภาพจิตแห่งชาติ</strong></p>
            <p>เบอร์โทร: 1323 (สายด่วนสุขภาพจิต)</p>
        </div>

        <br>
        <!-- เชื่อมกลับไปหน้าหลัก -->
        <a href="index.html" class="button">กลับไปหน้าหลัก</a>
        <!-- เชื่อมกลับไปหน้าผลลัพธ์ -->
        <a href="results.html" class="button">ดูผลลัพธ์</a>
    </div>

</body>
</html>
